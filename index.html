<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peacepot</title>
<link rel="icon" href="icon.png">
<style>
  :root { color-scheme: light dark; --bg:#fff; --text:#1a1a1a; --muted:#666; --card:#f6f6f7; --line:#ddd; --link:#9a6700; --accent:#EDA100; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0 auto; line-height: 1.6; color: var(--text); background: var(--bg);
  }
  a { color: var(--link); }
  ul { padding-left: 1.25rem; }
  li { margin-bottom: 0.5rem; }
  footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--line); font-size: 0.85rem; color: var(--muted); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141A2B; --text:#F0EFEC; --muted:#9AA3B8; --card:#1D2438; --line:#2A3350; --link:#F6C453; }
  }

  body { max-width: 480px; padding: 4rem 1.25rem; text-align: center; }
  img.icon { width: 112px; height: 112px; border-radius: 22.5%; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
  h1 { font-size: 1.8rem; margin: 1rem 0 0.25rem; }
  p.sub { color: var(--muted); margin-top: 0; margin-bottom: 1.5rem; }
  p.about { margin-bottom: 2.5rem; }
  .links { display: flex; flex-direction: column; gap: 0.75rem; }
  a.button { display: block; padding: 0.9rem 1.25rem; border-radius: 8px; background: var(--card); color: var(--link); text-decoration: none; font-weight: 600; }
  a.button:hover { filter: brightness(0.96); }
  footer { border-top: none; }
</style>
</head>
<body>
<img class="icon" src="icon.png" alt="Peacepot app icon">
<h1>Peacepot</h1>
<p class="sub">Simple monthly budgeting for iOS</p>
<p class="about">Fill in your monthly income and see how to divide it: needs, a safety buffer, savings, debt, and fun.</p>

<div class="links">
  <a class="button" href="support.html">Support</a>
  <a class="button" href="legal.html">Privacy Policy &amp; Terms of Service</a>
</div>

<footer>
  <p>Peacepot — a WildSprout Studios app.</p>
</footer>
</body>
</html>
